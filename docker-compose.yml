# Infra-only compose. Run: docker compose up -d
# The three NestJS app services (auth-gateway, txn-service, read-service) run
# LOCALLY during development (npm run start:dev), connecting to these containers
# via the ports below. See docker-compose.full.yml for a profile that also
# containerizes the app services, used for integration/load/chaos testing.

volumes:
  pgdata:   # NAMED volume — never bind-mount to the Windows filesystem (PLAN.md §2.3):
            # fsync through Docker Desktop/WSL2 onto NTFS is a severe perf cliff, and
            # we run synchronous_commit=on deliberately.
  redpanda_data:

networks:
  pstu:
    name: pstu_default

services:
  postgres:
    image: postgres:16
    container_name: pstu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pstu
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # migrations + schema apply connect HERE, directly
    command: >
      postgres
        -c shared_buffers=512MB
        -c max_wal_size=4GB
        -c wal_compression=on
        -c synchronous_commit=on
        -c commit_delay=2000
        -c commit_siblings=5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pstu]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pstu_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/pstu"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 50
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: postgres
    ports:
      - "6432:5432"          # every app connects HERE (not :5432) once pooled
    networks: [pstu]

  redis:
    image: redis:7-alpine
    container_name: pstu_redis
    restart: unless-stopped
    # No persistence configured — the read cache holds nothing that isn't in
    # Postgres, so an empty Redis on restart is a correct, expected state.
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks: [pstu]

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: pstu_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:18082
    ports:
      - "19092:19092"        # host apps connect HERE
      - "18082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks: [pstu]

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: pstu_redpanda_console
    restart: unless-stopped
    depends_on: [redpanda]
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8090:8080"
    networks: [pstu]

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: pstu_centrifugo
    restart: unless-stopped
    volumes:
      - ./infra/centrifugo/config.json:/centrifugo/config.json:ro
    command: centrifugo --config=config.json
    ports:
      - "8000:8000"
    networks: [pstu]
